[package]
name = "policy-engine"
version = "0.1.0"
edition = "2021"
description = "Adaptive policy engine — composable Allow/StepUp/Deny evaluators (standalone scaffold, not yet wired into a service)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
