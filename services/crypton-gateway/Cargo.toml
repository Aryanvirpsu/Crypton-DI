[package]
name = "crypton-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP server + middleware
axum        = { version = "0.7", features = ["macros"] }
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "cors", "request-id"] }

# HTTP client (proxying to identity)
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Database (device context queries)
sqlx        = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid"] }

# Redis (nonce, rate-limit, policy, step-up)
redis       = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Auth
jsonwebtoken = "9"

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# IDs
uuid        = { version = "1", features = ["v4"] }

# Byte buffers
bytes       = "1"

# Logging / tracing
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }

# Risk engine (local path — deterministic scoring and policy decisions)
risk-engine = { path = "../../risk-engine" }

# Time (for RiskContext.evaluated_at)
chrono      = { version = "0.4", features = ["serde"] }

# Async trait (required by risk-engine SignalStore impl)
async-trait = "0.1"

# Utilities
anyhow      = "1"
dotenvy     = "0.15"

[dev-dependencies]
# Router-level tests drive the real Axum router with `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
