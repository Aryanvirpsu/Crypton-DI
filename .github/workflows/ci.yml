name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # New advisories appear without any code change, so audit weekly as well.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Keep this fast and boring: format/check/test each crate and each frontend
# package. No deployment steps here on purpose.
jobs:
  rust:
    if: github.event_name != 'schedule'  # the weekly run is for the advisory audit only
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypton
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # crypton-id's #[sqlx::test] tests create throwaway per-test databases
      # against this connection, and the redis/sessions.rs denylist test
      # uses REDIS_URL directly. Values below are CI-only, never real secrets.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crypton
      REDIS_URL: redis://127.0.0.1:6379
      # Asymmetric (Ed25519/EdDSA) since v0.5.1 — see DECISIONS.md. Generated
      # fresh below into CI-only files; never used outside this workflow.
      JWT_SIGNING_KEY_PEM_FILE: /tmp/jwt_signing_key.ci.pem
      JWT_PUBLIC_KEY_PEM_FILE: /tmp/jwt_public_key.ci.pem
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:8080
      WEBAUTHN_RP_NAME: Crypton CI
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/crypton-id
            services/crypton-gateway

      - name: Generate CI-only JWT keypair
        run: |
          openssl genpkey -algorithm ed25519 -out "$JWT_SIGNING_KEY_PEM_FILE"
          openssl pkey -in "$JWT_SIGNING_KEY_PEM_FILE" -pubout -out "$JWT_PUBLIC_KEY_PEM_FILE"

      - name: crypton-id — fmt check
        working-directory: services/crypton-id
        run: cargo fmt --check

      - name: crypton-id — check
        working-directory: services/crypton-id
        run: cargo check --all-targets

      - name: crypton-id — test
        working-directory: services/crypton-id
        run: cargo test

      - name: crypton-gateway — fmt check
        working-directory: services/crypton-gateway
        run: cargo fmt --check

      - name: crypton-gateway — check
        working-directory: services/crypton-gateway
        run: cargo check --all-targets

      - name: crypton-gateway — test
        working-directory: services/crypton-gateway
        run: cargo test

      # Router-level and end-to-end tests against the Redis/Postgres service
      # containers above (they are #[ignore]d locally so a plain `cargo test`
      # never needs infrastructure). They create their own databases; the base one
      # below is only where they connect first.
      - name: Create database for gateway integration tests
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database gwtest'

      - name: crypton-gateway — integration tests (real Redis/Postgres)
        working-directory: services/crypton-gateway
        env:
          GATEWAY_TEST_REDIS_URL: redis://127.0.0.1:6379
          GATEWAY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gwtest
        run: cargo test -- --ignored

  # RustSec audit of every Rust lockfile. Fails on any vulnerability that is not listed,
  # with a justification and a reopen trigger, in scripts/rust-audit-ignore.txt;
  # unmaintained/unsound/yanked warnings are printed but do not fail. See
  # docs/dependency-audit.md.
  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: bash scripts/rust-audit.sh

  # The real services (crypton-id + gateway images built from source) with real
  # Postgres/Redis, driven end to end. This is the only job that exercises the
  # whole system; see docs/testing.md and docs/deployment-topology.md.
  runtime:
    if: github.event_name != 'schedule'  # the weekly run is for the advisory audit only
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Real-stack runtime verification
        run: bash tests/runtime/run.sh

  frontend:
    if: github.event_name != 'schedule'  # the weekly run is for the advisory audit only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build SDK (cjs + esm + types)
        run: npm run build:sdk

      - name: Typecheck SDK
        working-directory: libs/crypton-sdk
        run: npm run typecheck

      - name: Test SDK
        working-directory: libs/crypton-sdk
        run: npm test

      # CI is true on GitHub Actions, so react-scripts treats lint warnings as
      # errors: both production builds must be warning-free.
      - name: Build crypton-main
        working-directory: services/crypton-main
        run: npm run build

      - name: Test crypton-main
        working-directory: services/crypton-main
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build crypton-console
        working-directory: services/crypton-console
        run: npm run build

      - name: Test crypton-console
        working-directory: services/crypton-console
        run: npm test -- --watchAll=false
