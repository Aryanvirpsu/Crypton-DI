services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypton
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # No password: this is local-only dev infra (bound to localhost, never
    # exposed). A previous version required one here but every service's
    # REDIS_URL (dev.env.example, .env.example) connects without a
    # password, so auth failed on first run. Don't reintroduce a password
    # here without also updating every REDIS_URL to match.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
